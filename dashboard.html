<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow · 대시보드</title>
<style>
  :root{--primary:#1677ff;--bg:#f5f5f5;--text:rgba(0,0,0,.88);--sub:rgba(0,0,0,.45);--border:#f0f0f0;
        --todo:#bfbfbf;--doing:#1677ff;--done:#52c41a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  aside{width:208px;background:#001529;color:#fff;flex-shrink:0}
  aside h1{font-size:18px;margin:0;padding:16px 24px;height:64px;line-height:32px}
  aside a{display:block;padding:10px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px}
  aside a.on{background:var(--primary);color:#fff}
  aside a.child{padding:10px 24px 10px 40px;font-size:14px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.08)}
  aside a.child.on{background:var(--primary);color:#fff}
  .main{flex:1;min-width:0}
  header{height:64px;background:#fff;padding:0 24px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,21,41,.08);font-weight:600}
  .content{padding:24px;display:grid;gap:16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
  .card{background:#fff;border-radius:8px;padding:20px 24px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card h2{margin:0 0 16px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stat span{color:var(--sub);font-size:14px}
  .stat b{display:block;font-size:30px;margin-top:4px}
  .rate{display:flex;align-items:center;gap:16px}
  .bar{flex:1;height:12px;background:#f0f0f0;border-radius:6px;overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .rate strong{font-size:28px;min-width:72px;text-align:right}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .donutwrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .legend div{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .chart{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:8px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--sub)}
  .col em{font-style:normal;color:var(--text);margin-bottom:2px}
  .col div{width:100%;max-width:36px;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  li:last-child{border:0}
  .tag{padding:0 8px;border-radius:4px;font-size:12px;line-height:22px;color:#fff;white-space:nowrap}
  .sub{color:var(--sub);font-size:12px}
  .empty{text-align:center;color:var(--sub);padding:24px}
  a.tlink{color:var(--primary);text-decoration:none;font-weight:600}
  a.tlink:hover{text-decoration:underline}
  a.btnlink{display:inline-block;padding:2px 12px;border:1px solid var(--primary);border-radius:6px;color:var(--primary);text-decoration:none;font-size:13px}
  a.btnlink:hover{background:#e6f4ff}
  .pubact{display:flex;align-items:center;gap:8px;flex-shrink:0}
  @media(max-width:640px){aside{display:none}}
</style>
</head>
<body>
<aside><h1>TaskFlow</h1><a class="on" href="dashboard.html">대시보드</a><a class="child" href="overall.html">└ 전체 진행 현황</a><a class="child" href="progress.html">└ 내 과제 진행률</a><a href="ai-projects.html">AI 과제 목록</a><a href="similar.html">유사과제 탐색</a></aside>
<div class="main">
  <header>대시보드</header>
  <div class="content" id="app"></div>
</div>
<script src="demo-data.js"></script>
<script src="auth.js"></script>
<script src="storage.js"></script>
<script src="file-storage.js"></script>
<script>
let fileMap={}; // 과제id → 첨부 파일 목록 (서비스 게시 완료 카드의 첨부 현황용)
const STATUS={todo:['검토','var(--todo)','#bfbfbf'],doing:['진행','var(--doing)','#1677ff'],done:['종료','var(--done)','#52c41a']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(tasks){
const total=tasks.length;
const cnt=k=>tasks.filter(t=>t.s===k).length;
const pct=n=>total?Math.round(n/total*100):0;
const avgProg=total?Math.round(tasks.reduce((s,t)=>s+(+t.progress||0),0)/total):0;
const fmtAt=s=>{const d=new Date(s);return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const feed=tasks.flatMap(t=>(t.history||[]).map(h=>({t,h}))).reverse().sort((a,b)=>new Date(b.h.at)-new Date(a.h.at)).slice(0,8);
const dleft=t=>(t.due&&t.s!=='done')?Math.round((new Date(t.due+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/864e5):null;
const overdue=tasks.filter(t=>dleft(t)!==null&&dleft(t)<0).length;
const soon=tasks.filter(t=>dleft(t)!==null&&dleft(t)>=0&&dleft(t)<=3).length;

// 도넛 차트
const R=52,C=2*Math.PI*R;let off=0;
const arcs=total?Object.entries(STATUS).map(([k,[,,col]])=>{
  const len=cnt(k)/total*C;
  const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
  off+=len;return s}).join(''):'<circle r="52" cx="70" cy="70" fill="none" stroke="#f0f0f0" stroke-width="22"/>';

// 최근 7일 등록 (id=등록 시각)
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d});
const dayCnt=days.map(d=>tasks.filter(t=>{const x=new Date(+t.id);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate()}).length);
const max=Math.max(1,...dayCnt);

const recent=tasks.slice(0,5);
// 서비스 게시 완료 과제: 게시일이 최근인 순. 과제명·'상세'를 누르면 과제 상세(올라간 파일·상세 현황·이력)로 이동
const published=tasks.filter(t=>t.registered).sort((a,b)=>(b.registeredAt||'').localeCompare(a.registeredAt||''));
const pubRows=published.slice(0,5).map(t=>{
  const fs=fileMap[String(t.id)]||[],req=FileStorage.checkRequired(fs).filter(r=>r.ok).length,href=`task-detail.html?id=${encodeURIComponent(t.id)}&from=dashboard`;
  return `<li><span><a class="tlink" href="${href}">${esc(t.title)}</a><br><span class="sub">${esc(t.assignee||'담당자 없음')} · 게시일 ${esc(t.registeredAt||'-')} · 승인자 ${esc(t.approver||'-')}</span></span>
    <span class="pubact"><span class="tag" style="background:${req===3?'#52c41a':'#fa8c16'}" title="필수 첨부 3종 중 ${req}종 / 전체 ${fs.length}개">필수 ${req}/3 · ${fs.length}개</span><a class="btnlink" href="${href}">상세</a></span></li>`}).join('');
document.getElementById('app').innerHTML=`
<div class="stats">
  <div class="card stat"><span>전체 과제</span><b>${total}</b></div>
  ${Object.entries(STATUS).map(([k,[n,c]])=>`<div class="card stat"><span>${n}</span><b style="color:${k==='todo'?'inherit':c}">${cnt(k)}</b></div>`).join('')}
  <div class="card stat"><span>서비스 게시 완료</span><b style="color:var(--done)">${published.length}</b></div>
  <div class="card stat"><span>마감 지연</span><b style="color:${overdue?'#ff4d4f':'inherit'}">${overdue}</b></div>
  <div class="card stat"><span>평균 진행률</span><b style="color:var(--primary)">${avgProg}%</b></div>
  <div class="card stat"><span>마감 임박(3일)</span><b style="color:${soon?'#fa8c16':'inherit'}">${soon}</b></div>
</div>
<div class="card">
  <h2>전체 진행률 <span class="sub">(종료 과제 비율)</span><a href="overall.html" style="margin-left:auto;font-size:13px;font-weight:400;color:var(--primary);text-decoration:none">전체 과제 진행 현황 보기 →</a></h2>
  <div class="rate">
    <div class="bar">${Object.entries(STATUS).reverse().map(([k,[,,c]])=>`<i style="width:${pct(cnt(k))}%;background:${c}"></i>`).join('')}</div>
    <strong>${pct(cnt('done'))}%</strong>
  </div>
  <div class="sub" style="margin-top:8px">종료 ${cnt('done')}건 / 전체 ${total}건 · 과제별 진행률 평균 ${avgProg}%</div>
</div>
<div class="grid2">
  <div class="card"><h2>상태별 비율</h2>
    <div class="donutwrap">
      <svg width="140" height="140" viewBox="0 0 140 140">${arcs}<text x="70" y="76" text-anchor="middle" font-size="22" font-weight="600">${total}</text></svg>
      <div class="legend">${Object.entries(STATUS).map(([k,[n,,c]])=>`<div><i style="background:${c}"></i>${n} ${cnt(k)}건 (${pct(cnt(k))}%)</div>`).join('')}</div>
    </div>
  </div>
  <div class="card"><h2>최근 7일 등록</h2>
    <div class="chart">${days.map((d,i)=>`<div class="col"><em>${dayCnt[i]||''}</em><div style="height:${dayCnt[i]/max*100}%"></div><span>${d.getMonth()+1}/${d.getDate()}</span></div>`).join('')}</div>
  </div>
</div>
<div class="card"><h2>서비스 게시 완료 <span class="sub">${published.length}건</span><a href="progress.html" style="margin-left:auto;font-size:13px;font-weight:400;color:var(--primary);text-decoration:none">내 과제 진행률에서 관리 →</a></h2>
  <div class="sub" style="margin-bottom:8px">과제명이나 '상세'를 누르면 올라간 파일과 상세 현황을 볼 수 있습니다.</div>
  ${published.length?`<ul>${pubRows}</ul>${published.length>5?`<div class="sub" style="padding-top:8px">최근 5건만 표시합니다. 전체 ${published.length}건은 <a class="tlink" href="progress.html">내 과제 진행률</a>에서 확인하세요.</div>`:''}`
  :'<div class="empty">서비스 게시된 과제가 아직 없습니다. 진행률 100%를 달성한 과제를 <a class="tlink" href="progress.html">내 과제 진행률</a>에서 서비스 게시하면 여기에 나타납니다.</div>'}
</div>
<div class="card"><h2>최근 변경 이력</h2>
  ${feed.length?`<ul>${feed.map(({t,h})=>`<li><span>${esc(t.title)}<br><span class="sub">${esc(h.text)}</span></span><span class="sub">${fmtAt(h.at)}</span></li>`).join('')}</ul>`:'<div class="empty">아직 기록된 변경 이력이 없습니다.</div>'}
</div>
<div class="card"><h2>최근 등록 과제</h2>
  ${recent.length?`<ul>${recent.map(t=>`<li><span>${esc(t.title)}<br><span class="sub">${esc(t.date||'')}</span></span><span class="tag" style="background:${(STATUS[t.s]||STATUS.todo)[1]}">${(STATUS[t.s]||STATUS.todo)[0]}</span></li>`).join('')}</ul>`
  :'<div class="empty">등록된 과제가 없습니다. <a href="ai-projects.html">AI 과제 목록</a>에서 추가해 보세요.</div>'}
</div>`;
}
// 저장 모듈(storage.js)에서 과제를 불러온다: 서버로 열면 data/tasks.json, 파일로 열면 localStorage
TaskStorage.init().then(async tasks=>{try{fileMap=await FileStorage.listMany(tasks)}catch(e){fileMap={}}render(tasks)}).catch(()=>render([]));
</script>
</body>
</html>
