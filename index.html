<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow · 과제 관리</title>
<style>
  /* Ant Design Pro 스타일 참고: https://github.com/ant-design/ant-design-pro */
  :root{--primary:#1677ff;--bg:#f5f5f5;--text:rgba(0,0,0,.88);--sub:rgba(0,0,0,.45);--border:#f0f0f0;
        --todo:#d9d9d9;--doing:#1677ff;--done:#52c41a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  aside{width:208px;background:#001529;color:#fff;flex-shrink:0}
  aside h1{font-size:18px;margin:0;padding:16px 24px;height:64px;line-height:32px}
  aside a{display:block;padding:10px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px}
  aside a.on{background:var(--primary);color:#fff}
  aside a.child{padding:10px 24px 10px 40px;font-size:14px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.08)}
  aside a.child.on{background:var(--primary);color:#fff}
  .main{flex:1;min-width:0}
  header{height:64px;background:#fff;padding:0 24px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,21,41,.08);font-weight:600}
  .content{padding:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:16px}
  .card{background:#fff;border-radius:8px;padding:20px 24px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .stat b{display:block;font-size:30px;margin-top:4px}
  .stat span{color:var(--sub);font-size:14px}
  form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  input,select,button{font:inherit;padding:6px 12px;border:1px solid #d9d9d9;border-radius:6px;background:#fff}
  input{flex:1;min-width:200px}
  button.p{background:var(--primary);border-color:var(--primary);color:#fff;cursor:pointer}
  .filters{display:flex;gap:8px;margin-bottom:12px}
  .filters button{cursor:pointer}.filters button.on{border-color:var(--primary);color:var(--primary)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--border);font-size:14px}
  th{background:#fafafa;font-weight:600}
  .tag{display:inline-block;padding:0 8px;border-radius:4px;font-size:12px;line-height:22px;color:#fff}
  .empty{text-align:center;color:var(--sub);padding:32px}
  .notice{border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:14px}
  .notice.warn{background:#fffbe6;border:1px solid #ffe58f}
  .notice.err{background:#fff2f0;border:1px solid #ffccc7}
  .notice[hidden]{display:none}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input{max-width:260px}
  .filters{margin-bottom:0}
  form input[type=date],form select{flex:0 0 auto;min-width:0}
  .p-high{background:#ff4d4f}.p-mid{background:#faad14}.p-low{background:#8c8c8c}
  .due-over{background:#ff4d4f}.due-soon{background:#fa8c16}.due-ok{background:#8c8c8c}
  .memo{display:block;color:var(--sub);font-size:12px;margin-top:2px}
  td input,td select{width:100%;min-width:0;padding:4px 8px}
  td .act{white-space:nowrap}
  td .act button{margin-left:4px;cursor:pointer}
  .tablewrap{overflow-x:auto}
  .tablewrap table{min-width:860px}
  td select[data-id]{min-width:76px}
  .pbar{display:flex;align-items:center;gap:8px;min-width:120px}
  .pbar .bar{flex:1;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
  .pbar .bar i{display:block;height:100%;background:var(--primary)}
  .pbar span{font-size:12px;color:var(--sub);width:34px;text-align:right}
  tr.hist td{background:#fafafa;padding:8px 16px 12px}
  .tl{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid #e6e6e6}
  .tl li{position:relative;padding:3px 0 3px 12px;font-size:13px;display:block;border:0}
  .tl li:before{content:"";position:absolute;left:-18px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .tl time{color:var(--sub);margin-right:8px;font-size:12px}
  header small{margin-left:auto;font-weight:400;font-size:13px;color:var(--sub)}
  @media(max-width:640px){aside{display:none}}
</style>
</head>
<body>
<aside><h1>TaskFlow</h1><a href="dashboard.html">대시보드</a><a class="child" href="progress.html">└ 과제 진행률</a><a class="on" href="index.html">과제 목록</a><a class="child" href="ai-projects.html">└ AI 과제 등록</a><a href="similar.html">유사과제 탐색</a></aside>
<div class="main">
  <header>과제 목록<small id="mode"></small></header>
  <div class="content">
    <div class="notice warn" id="warn" hidden>지금은 <b>이 브라우저에만 임시 저장</b>됩니다. 파일로 영구 저장하려면 터미널에서 <code>python3 server.py</code>를 실행한 뒤 <code>http://localhost:8000</code>으로 접속하세요.</div>
    <div class="notice err" id="err" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <form id="f">
        <input id="title" placeholder="새 과제 이름" required>
        <input id="assignee" placeholder="담당자" style="max-width:120px;min-width:80px">
        <input id="due" type="date" title="마감일">
        <select id="priority" title="우선순위"><option value="mid">보통</option><option value="high">높음</option><option value="low">낮음</option></select>
        <button class="p" type="submit">과제 추가</button>
      </form>
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <input id="q" type="search" placeholder="과제·담당자·메모 검색">
        <select id="sort">
          <option value="new">최신 등록순</option>
          <option value="due">마감일 빠른순</option>
          <option value="pri">우선순위순</option>
          <option value="name">이름순</option>
        </select>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>과제</th><th>담당자</th><th>마감일</th><th>우선순위</th><th>진행률</th><th>단계</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="storage.js"></script>
<script>
const STATUS={todo:['검토','var(--todo)'],doing:['진행','var(--doing)'],done:['종료','var(--done)']};
const fmtAt=s=>{const d=new Date(s);return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const PRI={high:['높음','p-high',0],mid:['보통','p-mid',1],low:['낮음','p-low',2]};
let tasks=[],filter='all',query='',sort='new',editing=null,openHist=new Set();
const $=id=>document.getElementById(id);
const showError=msg=>{const el=$('err');el.textContent=msg||'';el.hidden=!msg};
// 저장소 호출을 감싸서: 성공하면 목록을 다시 읽고, 실패하면 오류를 화면에 보여 준다
async function persist(fn){
  try{await fn();showError('');}
  catch(e){showError('저장하지 못했습니다: '+e.message);}
  try{tasks=await TaskStorage.list();}catch(e){}
  render();
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function dday(t){
  if(!t.due)return null;
  const diff=Math.round((new Date(t.due+'T00:00:00')-today())/864e5);
  if(t.s==='done')return{txt:t.due,cls:'due-ok'};
  if(diff<0)return{txt:`${t.due} (D+${-diff} 지연)`,cls:'due-over'};
  if(diff===0)return{txt:`${t.due} (오늘)`,cls:'due-soon'};
  return{txt:`${t.due} (D-${diff})`,cls:diff<=3?'due-soon':'due-ok'};
}
const overdue=t=>{const d=dday(t);return d&&d.cls==='due-over'};
function visible(){
  const q=query.trim().toLowerCase();
  const l=tasks.filter(t=>(filter==='all'||t.s===filter)&&(!q||[t.title,t.assignee,t.memo].some(v=>(v||'').toLowerCase().includes(q))));
  const pri=t=>(PRI[t.priority]||PRI.mid)[2];
  const by={
    new:(a,b)=>b.id-a.id,
    due:(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||b.id-a.id,
    pri:(a,b)=>pri(a)-pri(b)||(a.due||'9999').localeCompare(b.due||'9999'),
    name:(a,b)=>a.title.localeCompare(b.title,'ko')
  };
  return l.sort(by[sort]);
}
function histRow(t){
  const h=(t.history||[]).slice().reverse();
  return `<tr class="hist"><td colspan="7">${h.length?`<ul class="tl">${h.map(x=>`<li><time>${fmtAt(x.at)}</time>${esc(x.text)}</li>`).join('')}</ul>`:'<span class="sub">기록된 이력이 없습니다. 이후 변경부터 기록됩니다.</span>'}</td></tr>`;
}
function row(t){
  if(editing==t.id)return `<tr>
    <td><input id="e-title" value="${esc(t.title)}"><input id="e-memo" value="${esc(t.memo)}" placeholder="메모" style="margin-top:4px"></td>
    <td><input id="e-assignee" value="${esc(t.assignee)}"></td>
    <td><input id="e-due" type="date" value="${esc(t.due)}"></td>
    <td><select id="e-priority">${Object.entries(PRI).map(([k,[n]])=>`<option value="${k}" ${(t.priority||'mid')===k?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input id="e-progress" type="number" min="0" max="100" step="5" value="${+t.progress||0}" title="진행률(%)"></td>
    <td></td>
    <td class="act"><button class="p" data-save="${t.id}">저장</button><button data-cancel="1">취소</button></td></tr>`;
  const d=dday(t),p=PRI[t.priority]||PRI.mid;
  return `<tr><td>${esc(t.title)}${t.memo?`<span class="memo">${esc(t.memo)}</span>`:''}</td>
    <td>${esc(t.assignee)||'-'}</td>
    <td>${d?`<span class="tag ${d.cls}">${d.txt}</span>`:'-'}</td>
    <td><span class="tag ${p[1]}">${p[0]}</span></td>
    <td><div class="pbar"><div class="bar"><i style="width:${+t.progress||0}%"></i></div><span>${+t.progress||0}%</span></div></td>
    <td><select data-id="${t.id}">${Object.entries(STATUS).map(([k,[n]])=>`<option value="${k}" ${t.s===k?'selected':''}>${n}</option>`).join('')}</select></td>
    <td class="act"><button data-hist="${t.id}">이력${(t.history||[]).length?' '+t.history.length:''}</button><button data-edit="${t.id}">수정</button><button data-del="${t.id}">삭제</button></td></tr>${openHist.has(String(t.id))?histRow(t):''}`;
}
function render(){
  const cnt=k=>tasks.filter(t=>t.s===k).length;
  const od=tasks.filter(overdue).length;
  $('stats').innerHTML=
    `<div class="card stat"><span>전체</span><b>${tasks.length}</b></div>`+
    Object.entries(STATUS).map(([k,[n]])=>`<div class="card stat"><span>${n}</span><b>${cnt(k)}</b></div>`).join('')+
    `<div class="card stat"><span>마감 지연</span><b style="color:${od?'#ff4d4f':'inherit'}">${od}</b></div>`;
  $('filters').innerHTML=
    [['all','전체'],...Object.entries(STATUS).map(([k,[n]])=>[k,n])]
    .map(([k,n])=>`<button class="${filter===k?'on':''}" data-f="${k}">${n}</button>`).join('');
  const list=visible();
  $('rows').innerHTML=list.length?list.map(row).join(''):'<tr><td colspan="7" class="empty">표시할 과제가 없습니다.</td></tr>';
}
$('f').onsubmit=e=>{
  e.preventDefault();
  const title=$('title').value.trim();if(!title)return;
  const f={title,assignee:$('assignee').value.trim(),due:$('due').value,priority:$('priority').value};
  persist(async()=>{await TaskStorage.create(f);$('title').value='';$('assignee').value='';$('due').value='';$('priority').value='mid';});
};
$('q').oninput=e=>{query=e.target.value;render()};
$('sort').onchange=e=>{sort=e.target.value;render()};
document.addEventListener('click',e=>{
  const d=e.target.dataset;
  if(d.f){filter=d.f;render()}
  if(d.del){if(confirm('이 과제를 삭제할까요?'))persist(()=>TaskStorage.remove(d.del))}
  if(d.edit){editing=d.edit;render()}
  if(d.hist){openHist.has(d.hist)?openHist.delete(d.hist):openHist.add(d.hist);render()}
  if(d.cancel){editing=null;render()}
  if(d.save){
    const title=$('e-title').value.trim();if(!title){showError('과제 이름을 입력하세요.');return}
    const f={title,memo:$('e-memo').value.trim(),assignee:$('e-assignee').value.trim(),due:$('e-due').value,priority:$('e-priority').value,progress:Math.min(100,Math.max(0,Math.round(+$('e-progress').value||0)))};
    editing=null;persist(()=>TaskStorage.update(d.save,f));
  }
});
document.addEventListener('change',e=>{
  if(e.target.dataset.id){const id=e.target.dataset.id,s=e.target.value;persist(()=>TaskStorage.update(id,s==='done'?{s,progress:100}:{s}))}
});
(async()=>{
  tasks=await TaskStorage.init();
  const server=TaskStorage.mode==='server';
  $('mode').textContent=server?'● 서버 파일에 저장 중':'● 브라우저 임시 저장';
  $('warn').hidden=server;
  render();
})();
</script>
</body>
</html>
