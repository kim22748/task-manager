<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow · 내 정보</title><link rel="stylesheet" href="common.css"></head>
<body>
<aside><h1><a href="index.html" title="처음 화면으로" style="display:inline;padding:0;color:inherit;background:none;text-decoration:none">TaskFlow</a></h1><a href="dashboard.html">대시보드</a><a class="child" href="overall.html">└ 세부 진행 현황</a><a class="child" href="progress.html">└ 내 과제 진행률</a><a href="ai-projects.html">AI 과제 목록</a><a href="similar.html">유사과제 탐색</a></aside>
<div class="main">
<header>내 정보</header>
<div class="content" style="max-width:560px">
  <div class="notice warn" id="force" hidden>임시 비밀번호로 로그인했습니다. <b>새 비밀번호로 변경</b>해야 다른 기능을 사용할 수 있습니다.</div>
  <div class="card" id="info"></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">비밀번호 변경</h3>
    <div class="notice err" id="err" hidden></div><div class="notice ok" id="ok" hidden></div>
    <form id="form" novalidate>
      <div class="field"><label>현재 비밀번호</label><input id="cur" type="password" autocomplete="current-password"></div>
      <div class="field"><label>새 비밀번호</label><input id="n1" type="password" autocomplete="new-password"><div class="hint">8자 이상, 영문·숫자·특수문자 포함</div></div>
      <div class="field"><label>새 비밀번호 확인</label><input id="n2" type="password" autocomplete="new-password"></div>
      <button class="p" type="submit">변경</button>
    </form></div>
</div></div>
<script src="auth.js"></script>
<script>
(async()=>{
  const u=await Auth.guard();
  if(u.mustChangePw) force.hidden=false;
  const row=(k,v)=>`<tr><th style="width:110px">${k}</th><td>${v}</td></tr>`;
  info.innerHTML=`<table>${row('성명',Auth.esc(u.name))}${row('사번',Auth.esc(u.empNo))}${row('소속',Auth.esc(u.dept))}${row('이메일',Auth.esc(u.email)||'-')}${row('역할',Auth.tag(Auth.ROLE[u.role]))}</table>`;
  form.onsubmit=async e=>{
    e.preventDefault(); err.hidden=ok.hidden=true;
    if(Auth.preview){ err.textContent='디자인 미리보기에서는 비밀번호를 바꿀 수 없습니다.'; err.hidden=false; return; }
    if(n1.value!==n2.value){ err.textContent='새 비밀번호 확인이 일치하지 않습니다.'; err.hidden=false; return; }
    try{ await Auth.api('POST','api/auth/password',{current:cur.value,new:n1.value}); ok.textContent='비밀번호를 변경했습니다.'; ok.hidden=false; form.reset(); if(u.mustChangePw) setTimeout(()=>location.href='dashboard.html',1000); }
    catch(ex){ err.textContent=ex.message; err.hidden=false; }
  };
})();
</script></body></html>
