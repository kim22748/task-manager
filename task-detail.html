<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow · 과제 상세</title>
<style>
  :root{--primary:#1677ff;--bg:#f5f5f5;--text:rgba(0,0,0,.88);--sub:rgba(0,0,0,.45);--border:#f0f0f0;--done:#52c41a;--warn:#fa8c16;--danger:#ff4d4f}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  aside{width:208px;background:#001529;color:#fff;flex-shrink:0}
  aside h1{font-size:18px;margin:0;padding:16px 24px;height:64px;line-height:32px}
  aside a{display:block;padding:10px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px}
  aside a.on{background:var(--primary);color:#fff}
  aside a.child{padding:10px 24px 10px 40px;font-size:14px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.08)}
  aside a.child.on{background:var(--primary);color:#fff}
  .main{flex:1;min-width:0}
  header{height:64px;background:#fff;padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,21,41,.08);font-weight:600}
  header a{font-weight:400;font-size:14px;color:var(--primary);text-decoration:none}
  header small{margin-left:auto;font-weight:400;font-size:13px;color:var(--sub)}
  .content{padding:24px;display:grid;gap:16px}
  .card{background:#fff;border-radius:8px;padding:20px 24px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
  .card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card h2 em{font-style:normal;font-weight:400;font-size:13px;color:var(--sub)}
  .desc{color:var(--sub);font-size:13px;margin:0 0 16px}
  .title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title h2{font-size:20px;margin:0}
  .tag{display:inline-block;padding:0 8px;border-radius:4px;font-size:12px;line-height:22px;color:#fff;white-space:nowrap}
  .tag.ai{background:#f9f0ff;color:#531dab;border:1px solid #d3adf7}
  .progedit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .progedit input[type=range]{width:220px;padding:0;border:0}
  .progedit output{min-width:44px;font-weight:600}
  button.p{background:var(--primary);border-color:var(--primary);color:#fff}
  button.p:hover{color:#fff;opacity:.85}
  .aistage{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .seg{display:flex;gap:2px;width:180px}
  .seg i{flex:1;height:6px;border-radius:3px;background:#f0f0f0}
  .seg i.on{background:var(--c)}
  .card h2 a.goai{margin-left:auto;font-size:13px;font-weight:400;color:var(--primary);text-decoration:none}
  .tag.mine{background:#e6f4ff;color:#0958d9;border:1px solid #91caff}
  .tag.other{background:#f5f5f5;color:#595959;border:1px solid #d9d9d9}
  a.btnlink{display:inline-block;padding:2px 12px;border:1px solid var(--primary);border-radius:6px;color:var(--primary);text-decoration:none;font-size:13px;font-weight:400}
  a.btnlink:hover{background:#e6f4ff}
  .tag.ok{background:var(--done)}.tag.wait{background:var(--warn)}.tag.st{background:#e6f4ff;color:#0958d9;border:1px solid #91caff}
  .tag.no{background:#fff2f0;color:#cf1322;border:1px solid #ffccc7}
  dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px;margin:16px 0 0}
  dl div{min-width:0}
  dt{font-size:13px;color:var(--sub);margin-bottom:4px}
  dd{margin:0;font-size:14px;word-break:break-word;white-space:pre-wrap}
  .pbar{display:flex;align-items:center;gap:10px}
  .pbar div{flex:1;height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden;max-width:240px}
  .pbar i{display:block;height:100%;background:var(--primary)}
  .grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px}
  .req{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:16px}
  .req div{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .req div.ok{background:#f6ffed;border-color:#b7eb8f}
  .req div.no{background:#fff2f0;border-color:#ffccc7}
  .drop{border:1px dashed #d9d9d9;border-radius:8px;padding:16px;text-align:center;color:var(--sub);font-size:14px;margin-bottom:16px;transition:background .15s}
  .drop.over{background:#e6f4ff;border-color:var(--primary)}
  .drop b{color:var(--primary);cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
  th{background:#fafafa;font-weight:600;white-space:nowrap}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.act{white-space:nowrap;text-align:right}
  .tablewrap{overflow-x:auto}
  button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer}
  button:hover{border-color:var(--primary);color:var(--primary)}
  button.del:hover{border-color:var(--danger);color:var(--danger)}
  .title .actions{margin-left:auto;display:flex;gap:8px}
  .parts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;white-space:normal}
  .pchip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;background:#f6ffed;border:1px solid #b7eb8f;font-size:13px}
  .pchip em{font-style:normal;color:var(--sub);font-size:12px}
  .plist{margin-top:8px;max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:6px}
  dialog label.prow{display:flex;align-items:center;gap:10px;margin:0;padding:8px 12px;font-weight:400;border-bottom:1px solid var(--border);cursor:pointer}
  dialog label.prow:last-child{border-bottom:0}
  dialog label.prow:hover{background:#fafafa}
  dialog label.prow input{width:16px;height:16px;flex-shrink:0}
  .fnote{margin-top:2px;font-size:12px;color:rgba(0,0,0,.65);white-space:pre-wrap;word-break:break-word;max-width:420px}
  .uploader{margin-bottom:16px}
  .uploader label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
  .uploader textarea{width:100%;min-height:64px;resize:vertical;font:inherit;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;margin-bottom:8px}
  .uploader .drop{margin-bottom:8px}
  .uplist{list-style:none;margin:0 0 8px;border:1px solid var(--border);border-radius:6px;padding:0 12px}
  .uplist li{padding:8px 0;word-break:break-all}
  .upbtns{display:flex;align-items:center;justify-content:space-between;gap:8px}
  dialog{border:0;border-radius:8px;padding:24px;width:min(480px,92vw);max-height:90vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h3{margin:0 0 8px;font-size:16px}
  dialog label{display:block;font-size:14px;margin:12px 0 4px;font-weight:600}
  dialog label i{color:#ff4d4f;font-style:normal}
  dialog input[type=text],dialog input[type=date],dialog select,dialog textarea{width:100%;font:inherit;padding:6px 12px;border:1px solid #d9d9d9;border-radius:6px;background:#fff}
  dialog textarea{min-height:72px;resize:vertical}
  dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  dialog .dlgerr{color:#ff4d4f;font-size:13px;margin-top:8px;min-height:18px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .sub{color:var(--sub);font-size:12px}
  .empty{text-align:center;color:var(--sub);padding:24px}
  .notice{border-radius:8px;padding:10px 16px;font-size:14px}
  .notice.warn{background:#fffbe6;border:1px solid #ffe58f}
  .notice.err{background:#fff2f0;border:1px solid #ffccc7}
  .notice.ok{background:#f6ffed;border:1px solid #b7eb8f}
  .notice[hidden]{display:none}
  .timeline{list-style:none;margin:0;padding:0;max-height:520px;overflow:auto}
  .timeline li{position:relative;padding:0 0 16px 20px;font-size:14px}
  .timeline li::before{content:'';position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .timeline li::after{content:'';position:absolute;left:7px;top:16px;bottom:0;width:2px;background:var(--border)}
  .timeline li:last-child::after{display:none}
  .timeline time{display:block;font-size:12px;color:var(--sub)}
  .timeline time b{color:rgba(0,0,0,.75);font-weight:600}
  .timeline li.hrow{cursor:pointer}
  .timeline li.hrow:hover{background:#fafafa}
  .timeline li.hrow.open::before{background:var(--warn)}
  .hdetail{margin:8px 0 0;padding:10px 12px;background:#fafafa;border:1px solid var(--border);border-radius:6px;font-size:13px;cursor:default}
  .hdetail>div{display:flex;gap:8px;padding:2px 0;word-break:break-word}
  .hdetail .k{flex:0 0 64px;color:var(--sub)}
  .hdetail .hnote{white-space:pre-wrap}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  @media(max-width:640px){aside{display:none}.content{padding:16px}}
</style>
</head>
<body>
<aside><h1><a href="index.html" title="처음 화면으로" style="display:inline;padding:0;color:inherit;background:none;text-decoration:none">TaskFlow</a></h1><a href="dashboard.html">대시보드</a><a class="child on" href="overall.html">└ 세부 진행 현황</a><a class="child" href="progress.html">└ 내 과제 진행률</a><a href="similar.html">유사과제 탐색</a><a class="child" href="semantic-map.html">└ 의미 지도</a></aside>
<div class="main">
  <header><a href="overall.html">← 세부 진행 현황</a>과제 상세<small id="mode"></small></header>
  <div class="content" id="app">
    <div class="notice warn" id="warn" hidden>지금은 <b>이 브라우저에만 임시 저장</b>됩니다. 올린 파일도 이 브라우저에서만 보입니다. 팀이 함께 보려면 <code>python3 server.py</code>로 실행한 주소(<code>http://localhost:8885</code>)에서 올려 주세요.</div>
    <div class="notice err" id="err" hidden></div>
    <div class="notice ok" id="okmsg" hidden></div>
    <div id="body"><div class="card empty">불러오는 중…</div></div>
  </div>
</div>
<input type="file" id="picker" multiple hidden>
<dialog id="partDlg">
  <form id="partForm" method="dialog" novalidate>
    <h3>과제참여자 초대</h3>
    <div class="sub">이 과제에 초대할 사람을 고르세요. 초대된 사람은 이 과제의 세부사항을 볼 수 있습니다. 체크를 풀면 참여자에서 빠집니다.</div>
    <input type="text" id="pSearch" placeholder="이름·부서·사번 검색" style="margin-top:12px">
    <div class="plist" id="pList"></div>
    <div class="sub" id="pCount" style="margin-top:8px"></div>
    <div class="dlgerr" id="pErr"></div>
    <div class="btns"><button type="button" id="pCancel">취소</button><button type="submit" class="p" id="pSave">저장</button></div>
  </form>
</dialog>
<dialog id="editDlg">
  <form id="editForm" method="dialog" novalidate>
    <h3>과제 수정</h3>
    <div class="sub" id="editNote"></div>
    <div id="aiFields">
      <label for="eTitle">명칭 <i>*</i></label>
      <input type="text" id="eTitle" maxlength="200">
      <label for="ePurpose">목적 <i>*</i></label>
      <textarea id="ePurpose" maxlength="2000"></textarea>
      <label for="eCat">분류 <i>*</i></label>
      <select id="eCat"></select>
      <label for="eStage">AI 과제 단계 <i>*</i></label>
      <select id="eStage"></select>
      <label for="eOwner">과제책임자 이름 <i>*</i></label>
      <input type="text" id="eOwner" maxlength="50">
      <label for="eDept">과제책임자 소속부서 <i>*</i></label>
      <input type="text" id="eDept" maxlength="100">
      <label for="eAccess">공개 여부 <i>*</i></label>
      <select id="eAccess"></select>
    </div>
    <label for="eDue">마감일 <span class="sub">(선택)</span></label>
    <input type="date" id="eDue">
    <label for="ePri">우선순위</label>
    <select id="ePri"><option value="high">높음</option><option value="mid">보통</option><option value="low">낮음</option></select>
    <label for="eMemo">메모 <span class="sub">(선택)</span></label>
    <textarea id="eMemo" maxlength="500"></textarea>
    <div class="dlgerr" id="eErr"></div>
    <div class="btns"><button type="button" id="eCancel">취소</button><button type="submit" class="p" id="eSave">저장</button></div>
  </form>
</dialog>
<script src="demo-data.js"></script>
<script src="auth.js"></script>
<script src="storage.js"></script>
<script src="ai-storage.js"></script>
<script src="file-storage.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGE={todo:'검토',doing:'진행',done:'종료'};
const PRI={high:'높음',mid:'보통',low:'낮음'};
const taskId=new URLSearchParams(location.search).get('id');
const aiId=new URLSearchParams(location.search).get('ai');   // '내 AI 과제'에서 넘어오면 AI 과제 id
let task=null,ai=null,aiItems=[],files=[],busy=false;
const sameKey=s=>String(s||'').trim();
// 세부 진행 현황의 단계 (뒤로 갈수록 진행이 많이 된 것)
const AI_STAGES=['기획중','개발중','승인요청','승인검토중','활용중','활용종료'];
const AI_ACCESS=['공개','비공개'];   // 공개: 로그인한 모든 사용자가 세부사항을 봄 / 비공개: 과제책임자·과제참여자만
const AI_COLOR={'기획중':'#8c8c8c','개발중':'#1677ff','승인요청':'#fa8c16','승인검토중':'#722ed1','활용중':'#52c41a','활용종료':'#bfbfbf'};

const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const when=s=>s?String(s).replace('T',' ').slice(0,16):'-';
function showError(m){$('err').textContent=m||'';$('err').hidden=!m}
let okTimer;function showOk(m){$('okmsg').textContent=m;$('okmsg').hidden=!m;clearTimeout(okTimer);if(m)okTimer=setTimeout(()=>$('okmsg').hidden=true,4000)}

function statusTag(t){
  if(t.registered)return '<span class="tag ok">서비스 게시 완료</span>';
  if((+t.progress||0)>=100)return '<span class="tag wait">서비스 게시 대기</span>';
  return `<span class="tag st">${STAGE[t.s]||esc(t.s)}</span>`;
}

// 누가 본 화면인가: 내 과제인지 / 다른 과제책임자의 과제인지 (로그인했을 때만 구분. 서버 없는 미리보기에서는 모두 수정 가능)
const myName=()=>(typeof Auth!=='undefined'&&Auth.user&&!Auth.preview&&Auth.user.name)||'';
const isMine=t=>!!myName()&&(t.assignee||'').trim()===myName();
// 세부사항을 볼 수 있는 사람: 공개 과제는 로그인한 모두, 비공개 과제는 그 과제의 과제책임자·과제참여자와 사이트관리자.
// (서버 없는 미리보기는 로그인이 없어 누구인지 알 수 없으므로 모두 볼 수 있다)
const me=()=>(typeof Auth!=='undefined'&&Auth.user&&!Auth.preview)?Auth.user:null;
const isPart=t=>{const u=me();return !!u&&(t.participants||[]).some(p=>p.empNo===u.empNo)};
const canView=t=>{const u=me();return !u||u.role==='admin'||(!!ai&&ai.access==='공개')||isMine(t)||isPart(t)};
// 수정 권한: 서버 없는 미리보기는 모두 가능, 과제참여자는 쓰기 불가(서버도 막음), 사이트관리자는 모두, 과제책임자는 내 과제만
const canEdit=t=>{
  if(!myName())return true;
  const role=Auth.user&&Auth.user.role;
  if(role==='member')return false;
  return role==='admin'||isMine(t);
};

// 어느 화면에서 왔는지(from)에 따라 돌아가기 링크와 사이드바 강조를 맞춘다
const FROM={dashboard:['dashboard.html','대시보드'],overall:['overall.html','세부 진행 현황'],progress:['progress.html','내 과제 진행률']};
const from=FROM[new URLSearchParams(location.search).get('from')]?new URLSearchParams(location.search).get('from'):'overall';
function applyFrom(){
  const [href,label]=FROM[from];
  const back=document.querySelector('header > a');
  if(back){back.href=href;back.textContent='← '+label}
  const navHrefs=Object.values(FROM).map(v=>v[0]);
  document.querySelectorAll('aside a').forEach(a=>{
    const h=a.getAttribute('href');
    if(navHrefs.includes(h))a.classList.toggle('on',h===href);
  });
}

function ownerTag(t){
  if(!myName())return '';
  if(isMine(t))return `<span class="tag mine">내 과제</span><a class="btnlink" href="progress.html?task=${encodeURIComponent(t.id)}">내 과제 진행률에서 보기 →</a>`;
  return `<span class="tag other">${esc(t.assignee||'과제책임자 없음')} 님의 과제${canEdit(t)?'':' · 조회 전용'}</span>`;
}

// AI 과제 정보 카드: 세부 진행 현황에 등록된 내용 (목적·분류·단계·책임자·소속부서·공개 여부)
function aiCard(a){
  const idx=Math.max(0,AI_STAGES.indexOf(a.stage)),col=AI_COLOR[a.stage]||'#8c8c8c';
  const day=s=>esc(String(s||'').slice(0,10))||'-';
  return `<div class="card">
    <h2>AI 과제 정보 <em>세부 진행 현황에 등록된 내용</em><a class="goai" href="overall.html">세부 진행 현황 →</a></h2>
    <div class="aistage"><span class="tag" style="background:${col}">${esc(a.stage)}</span><span class="sub">${idx+1}/${AI_STAGES.length} 단계</span>
      <div class="seg" style="--c:${col}" title="${AI_STAGES.map((s,i)=>(i===idx?'● ':'')+s).join(' → ')}">${AI_STAGES.map((s,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div></div>
    <dl>
      <div style="grid-column:1/-1"><dt>목적</dt><dd>${esc(a.purpose)||'-'}</dd></div>
      <div><dt>분류</dt><dd>${esc(a.category)||'-'}</dd></div>
      <div><dt>과제책임자</dt><dd>${esc(a.ownerName)||'-'}</dd></div>
      <div><dt>소속부서</dt><dd>${esc(a.ownerDept)||'-'}</dd></div>
      <div><dt>공개 여부</dt><dd>${esc(a.access)||'-'}</dd></div>
      <div><dt>등록일</dt><dd>${day(a.createdAt)}</dd></div>
      <div><dt>최종 수정</dt><dd>${day(a.updatedAt||a.createdAt)}</dd></div>
    </dl>
  </div>`;
}
// 연결된 진행률 과제가 없는 AI 과제: AI 과제 정보만 보여 준다
function renderAIOnly(){
  const a=ai,col=AI_COLOR[a.stage]||'#8c8c8c';
  const mineAI=!!myName()&&sameKey(a.ownerName)===myName();
  document.title=`TaskFlow · ${a.title}`;
  $('body').innerHTML=`
  <div style="display:grid;gap:16px">
    <div class="card">

// ---------- 과제참여자 선택 (사이트관리자 · 이 과제의 과제책임자) ----------
const ROLE_LABEL={admin:'사이트관리자',owner:'과제책임자',member:'과제참여자'};
let allUsers=[],picked=new Set();
// 지정할 수 있는 사람: 사용 중인 사용자 (서버: /api/users/directory, 서버 없는 화면: 더미데이터의 사용자)
async function loadUsers(){
  if(TaskStorage.mode==='server'){
    const r=await fetch('api/users/directory',{cache:'no-store'});
    if(!r.ok)throw new Error('사용자 목록을 불러오지 못했습니다.');
    return r.json();
  }
  if(typeof DemoData==='undefined')return [];
  return (await DemoData.load()).users.filter(u=>u.status==='active');
}
function renderPartList(){
  const q=$('pSearch').value.trim().toLowerCase();
  const list=allUsers.filter(u=>!q||[u.name,u.dept,u.empNo].some(v=>String(v||'').toLowerCase().includes(q)));
  $('pList').innerHTML=list.length?list.map(u=>`<label class="prow"><input type="checkbox" data-emp="${esc(u.empNo)}"${picked.has(u.empNo)?' checked':''}>
      <span><b>${esc(u.name)}</b> <span class="sub" style="display:inline">${esc(u.dept||'')} · ${esc(ROLE_LABEL[u.role]||u.role||'')} · 사번 ${esc(u.empNo)}</span></span></label>`).join('')
    :'<div class="empty">조건에 맞는 사용자가 없습니다.</div>';
  $('pCount').textContent=`선택 ${picked.size}명`;
}
async function openParts(){
  if(!task||!canEdit(task))return;
  $('pErr').textContent='';$('pSearch').value='';$('pSave').disabled=false;
  try{allUsers=(await loadUsers()).filter(u=>(u.name||'').trim()!==(task.assignee||'').trim())}   // 과제책임자 본인은 뺀다
  catch(err){showError(err.message);return}
  const known=new Set(allUsers.map(u=>u.empNo));
  picked=new Set((task.participants||[]).map(u=>u.empNo).filter(e=>known.has(e)));
  renderPartList();
  $('partDlg').showModal();$('pSearch').focus();
}
$('pSearch').addEventListener('input',renderPartList);
$('pList').addEventListener('change',e=>{
  const emp=e.target.dataset.emp;if(!emp)return;
  e.target.checked?picked.add(emp):picked.delete(emp);
  $('pCount').textContent=`선택 ${picked.size}명`;
});
$('partForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!task||!canEdit(task))return;
  const list=allUsers.filter(u=>picked.has(u.empNo)).map(u=>({empNo:u.empNo,name:u.name,dept:u.dept||''}));
  $('pSave').disabled=true;
  try{
    await TaskStorage.update(task.id,{participants:list});

});

// ---------- 변경 이력: 누가 했는지 표시, 줄을 누르면 자세히(올린 파일·세부 설명) ----------
let openHist=null;      // 펼쳐 둔 이력의 순번(history 배열 기준)
const histWhen=h=>when(h.at&&new Date(h.at).toLocaleString('sv-SE'));
// 이력이 가리키는 파일: 새 이력은 file 정보가 들어 있고, 예전 이력은 '파일 첨부: 이름' 문구에서 이름을 읽는다
function histFile(h){
  if(h.file)return h.file;
  const m=/^파일 (첨부|삭제): (.+)$/.exec(h.text||'');
  return m?{name:m[2]}:null;
}
function histItem(h,idx){
  const f=histFile(h),open=openHist===idx;
  let detail='';
  if(open){
    // 지금도 남아 있는 파일인지: id 가 같거나(새 이력), 예전 이력이면 이름이 같은 파일
    const cur=f?(files.find(x=>f.id&&x.id===f.id)||(!f.id?files.find(x=>x.name===f.name):null)):null;
    const note=f?(f.note||(cur&&cur.note)||''):'';
    detail=`<div class="hdetail">
      <div><span class="k">작업자</span>${h.by?esc(h.by):'<span class="sub" style="display:inline">기록 없음 (이전 기록이거나 자동 처리)</span>'}</div>
      <div><span class="k">일시</span>${esc(histWhen(h))}</div>
      <div><span class="k">내용</span>${esc(h.text)}</div>
      ${f?`<div><span class="k">파일</span>${esc(f.name)}${f.kind||f.size!=null?` <span class="sub" style="display:inline">${[f.kind,f.size!=null?size(f.size):''].filter(Boolean).map(esc).join(' · ')}</span>`:''}</div>
      <div><span class="k">세부 설명</span>${note?`<span class="hnote">${esc(note)}</span>`:'<span class="sub" style="display:inline">적은 설명이 없습니다.</span>'}</div>
      <div><span class="k"></span>${cur?`<button type="button" data-dl="${esc(cur.id)}">내려받기</button>`:'<span class="sub" style="display:inline">지금은 삭제되어 내려받을 수 없습니다.</span>'}</div>`:''}
    </div>`;
  }
  return `<li class="hrow${open?' open':''}" data-hist="${idx}" title="누르면 자세히 봅니다"><time>${esc(histWhen(h))}${h.by?` · <b>${esc(h.by)}</b>`:''}</time>${esc(h.text)}${f?' <span class="hclip">📎</span>':''}${detail}</li>`;
}

// 과제(진행률)와 AI 과제는 '같은 명칭 + 같은 과제책임자(책임자) 이름'으로 연결된다
async function reload(){
  const tasks=await TaskStorage.list();
  try{aiItems=await AIStorage.list()}catch(e){aiItems=[]}
  if(aiId){          // AI 과제에서 들어옴: 연결된 진행률 과제가 있으면 그것을 상세로 보여 준다
    ai=aiItems.find(p=>String(p.id)===String(aiId))||null;
    task=ai?tasks.find(t=>sameKey(t.title)===sameKey(ai.title)&&sameKey(t.assignee)===sameKey(ai.ownerName))||null:null;
  }else{             // 진행률 과제에서 들어옴: 연결된 AI 과제가 있으면 정보를 함께 보여 준다
    task=tasks.find(t=>String(t.id)===String(taskId))||null;
    ai=task?aiItems.find(p=>sameKey(p.title)===sameKey(task.title)&&sameKey(p.ownerName)===sameKey(task.assignee))||null:null;
  }
  files=task?await FileStorage.list(task.id):[];
}

// 첨부 파일 카드 안에서: 세부 설명 칸은 항상 보이고, 고른 파일은 '선택한 파일'에 쌓였다가 '올리기'를 눌러야 올라간다.
// 세부 설명은 함께 올리는 파일 모두에 붙는다 (파일마다 다르게 적으려면 나눠서 올린다).
let pending=[],pendingNote='';
function upload(list){
  if(!list.length||busy||!canEdit(task))return;
  pending=[...pending,...list];
  render();
}
async function doUpload(){
  if(!pending.length||busy||!canEdit(task))return;
  const list=pending,note=pendingNote.trim();
  busy=true;showError('');$('upSave').disabled=true;
  const done=[],failed=[];
  for(const f of list){try{await FileStorage.upload(task.id,f,note);done.push(f.name)}catch(e){failed.push(e.message)}}
  pending=[];if(done.length)pendingNote='';      // 올라갔으면 설명 칸을 비운다 (모두 실패하면 적은 내용을 남겨 둠)
  try{await reload()}catch(e){}
  busy=false;render();
  if(failed.length)showError('올리지 못한 파일: '+failed.join(' / '));
  if(done.length)showOk(`${done.length}개 파일을 올렸습니다.`);
}

// ---------- 과제 수정·삭제 (사이트관리자 · 이 과제의 과제책임자) ----------
// AI 과제가 기준이고 서버가 과제 진행을 AI 과제에 맞춰 동기화하므로 이렇게 처리한다.
//  · 수정: 명칭·목적·분류·AI 과제 단계는 AI 과제에, 마감일·우선순위·메모는 과제 진행에 저장한다 (과제명은 서버가 진행 기록에도 맞춤).
//  · 삭제: AI 과제를 지운다 → 서버가 연결된 과제 진행(첨부 파일·이력 포함)도 정리한다. (진행 기록만 지우면 서버가 다시 만들어 버림)
async function loadCategories(cur){
  let cats=['개발','법률','노사','IT'];
  if(TaskStorage.mode==='server'){try{const r=await fetch('api/categories',{cache:'no-store'});if(r.ok)cats=(await r.json()).items.map(x=>x.name)}catch(e){}}
  else aiItems.forEach(p=>{if(p.category&&!cats.includes(p.category))cats.push(p.category)});
  if(cur&&!cats.includes(cur))cats=[...cats,cur];
  return cats;
}
async function openEdit(){
  const t=task,a=ai;
  if(!t||!canEdit(t))return;
  $('aiFields').hidden=!a;
  $('editNote').textContent=a?'과제책임자 이름을 바꾸면 내 과제 표시와 수정 권한도 그 사람 기준으로 바뀝니다.':'연결된 AI 과제가 없어 마감일·우선순위·메모만 수정합니다.';
  if(a){
    $('eTitle').value=a.title||'';$('ePurpose').value=a.purpose||'';
    const cats=await loadCategories(a.category);
    $('eCat').innerHTML=cats.map(c=>`<option${c===a.category?' selected':''}>${esc(c)}</option>`).join('');
    $('eStage').innerHTML=AI_STAGES.map(s=>`<option${s===a.stage?' selected':''}>${s}</option>`).join('');
    $('eOwner').value=a.ownerName||'';$('eDept').value=a.ownerDept||'';
    const acc=AI_ACCESS.includes(a.access)||!a.access?AI_ACCESS:[...AI_ACCESS,a.access];
    $('eAccess').innerHTML=acc.map(s=>`<option${s===a.access?' selected':''}>${esc(s)}</option>`).join('');
  }
  $('eDue').value=t.due||'';$('ePri').value=t.priority||'mid';$('eMemo').value=t.memo||'';
  $('eErr').textContent='';$('eSave').disabled=false;
  $('editDlg').showModal();
  (a?$('eTitle'):$('eDue')).focus();
}
$('editForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const t=task,a=ai;
  if(!t||!canEdit(t))return;
  const f={due:$('eDue').value,priority:$('ePri').value,memo:$('eMemo').value.trim()};
  let af=null;
  if(a){
    af={title:$('eTitle').value.trim(),purpose:$('ePurpose').value.trim(),category:$('eCat').value,stage:$('eStage').value,ownerName:$('eOwner').value.trim(),ownerDept:$('eDept').value.trim(),access:$('eAccess').value};
    for(const [k,l] of [['title','명칭'],['purpose','목적'],['category','분류'],['stage','단계'],['ownerName','과제책임자 이름'],['ownerDept','소속부서'],['access','공개 여부']]){
      if(!af[k]){$('eErr').textContent=`${l}을(를) 입력하세요.`;return}
    }
  }
  $('eSave').disabled=true;
  try{
    // 서버 없는 화면: 진행 기록이 아직 '이름+책임자'로만 AI 과제와 맞물려 있으면, 이름을 바꾸기 전에 연결(projectId)을 저장해 둔다.
    // (안 그러면 이름이 바뀌는 순간 연결이 끊겨 옛 기록이 지워지고 새 기록이 만들어져 첨부·이력이 사라진다)
    if(af&&TaskStorage.mode==='local'&&!t.projectId)await TaskStorage.update(t.id,{projectId:a.id});
    if(af)await AIStorage.update(a.id,af);      // 서버가 과제 진행의 과제명도 따라 바꾼다
    await TaskStorage.update(t.id,f);
    $('editDlg').close();
    await reload();render();
    showOk('과제를 수정했습니다.');
  }catch(err){
    $('eErr').textContent='저장하지 못했습니다: '+err.message;$('eSave').disabled=false;
    try{await reload()}catch(_){}
  }
});
async function deleteTask(){
  const t=task,a=ai;
  if(!t||!canEdit(t)||busy)return;
  const msg=a?`'${t.title}' 과제를 삭제할까요?\n\n이 과제의 등록 정보(명칭·목적·분류 등)와 첨부 파일·변경 이력이 모두 삭제됩니다. 되돌릴 수 없습니다.`
             :`'${t.title}' 과제를 삭제할까요?\n\n첨부 파일·변경 이력도 함께 삭제되며 되돌릴 수 없습니다.`;
  if(!confirm(msg))return;
  busy=true;showError('');
  try{
    if(a)await AIStorage.remove(a.id);else await TaskStorage.remove(t.id);
    location.href=FROM[from][0];                // 지운 과제의 상세는 더 볼 수 없으니 왔던 목록으로 돌아간다
  }catch(err){busy=false;showError('삭제하지 못했습니다: '+err.message)}
}

// 진행률 저장 (슬라이더 값 또는 100% 완료). 서버도 역할에 따라 쓰기를 한 번 더 검사한다.
async function saveProgress(v){
  if(!task||!canEdit(task)||busy)return;
  busy=true;showError('');
  try{
    await TaskStorage.update(task.id,{progress:v});
    await reload();
    busy=false;render();
    showOk(v===100?'100%를 달성했습니다. 서비스 게시 대기로 이동했습니다.':'진행률을 저장했습니다.');
  }catch(err){busy=false;showError('저장하지 못했습니다: '+err.message)}
}
document.addEventListener('input',e=>{
  if(e.target.id==='upNote')pendingNote=e.target.value;   // 화면을 다시 그려도 적던 설명이 남도록
  if(e.target.id==='pgRange')$('pgOut').textContent=e.target.value+'%';
});
$('picker').onchange=e=>{upload([...e.target.files]);e.target.value=''};
document.addEventListener('click',async e=>{
  const d=e.target.dataset;
  const meta=id=>files.find(f=>f.id===id);
  const hrow=e.target.closest('li[data-hist]');
  if(hrow&&!e.target.closest('button,a')){const i=+hrow.dataset.hist;openHist=openHist===i?null:i;render();return}
  if(e.target.id==='pgSave')saveProgress(+$('pgRange').value);
  if(e.target.id==='pgFull')saveProgress(100);
  if(e.target.id==='btnParts')openParts();
  if(e.target.id==='pCancel')$('partDlg').close();
  if(e.target.id==='btnEdit')openEdit();
  if(e.target.id==='btnDelete')deleteTask();
  if(e.target.id==='eCancel')$('editDlg').close();
  if(e.target.id==='upSave')doUpload();
  if(d.unpick!==undefined){pending=pending.filter((_,i)=>i!==+d.unpick);render()}
  if(d.dl){try{await FileStorage.download(task.id,meta(d.dl))}catch(err){showError(err.message)}}
  if(d.rm){
    const f=meta(d.rm);if(!f||!canEdit(task)||!confirm(`'${f.name}' 파일을 삭제할까요? 되돌릴 수 없습니다.`))return;
    try{await FileStorage.remove(task.id,f);await reload();render();showOk('파일을 삭제했습니다.')}catch(err){showError('삭제하지 못했습니다: '+err.message)}
  }
});

(async()=>{
  try{await TaskStorage.init()}catch(e){}
  try{await AIStorage.init()}catch(e){}
  const server=TaskStorage.mode==='server';
  $('mode').textContent=server?'● 서버 파일에 저장 중':'● 브라우저 임시 저장';
  $('warn').hidden=server;
  try{await reload()}catch(e){showError('불러오지 못했습니다: '+e.message)}
  applyFrom();
  if(!task&&!ai){$('body').innerHTML=`<div class="card empty">과제를 찾을 수 없습니다. <a href="${FROM[from][0]}">${FROM[from][1]}(으)로 돌아가기</a></div>`;return}
  if(task&&!canView(task)){renderBlocked();return}   // 주소로 직접 들어와도 과제책임자·과제참여자가 아니면 보여 주지 않는다
  render();
})();
</script>
</body>
</html>
