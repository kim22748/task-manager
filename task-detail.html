<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow · 과제 상세</title>
<style>
  :root{--primary:#1677ff;--bg:#f5f5f5;--text:rgba(0,0,0,.88);--sub:rgba(0,0,0,.45);--border:#f0f0f0;--done:#52c41a;--warn:#fa8c16;--danger:#ff4d4f}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  aside{width:208px;background:#001529;color:#fff;flex-shrink:0}
  aside h1{font-size:18px;margin:0;padding:16px 24px;height:64px;line-height:32px}
  aside a{display:block;padding:10px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px}
  aside a.on{background:var(--primary);color:#fff}
  aside a.child{padding:10px 24px 10px 40px;font-size:14px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.08)}
  aside a.child.on{background:var(--primary);color:#fff}
  .main{flex:1;min-width:0}
  header{height:64px;background:#fff;padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,21,41,.08);font-weight:600}
  header a{font-weight:400;font-size:14px;color:var(--primary);text-decoration:none}
  header small{margin-left:auto;font-weight:400;font-size:13px;color:var(--sub)}
  .content{padding:24px;display:grid;gap:16px}
  .card{background:#fff;border-radius:8px;padding:20px 24px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
  .card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card h2 em{font-style:normal;font-weight:400;font-size:13px;color:var(--sub)}
  .desc{color:var(--sub);font-size:13px;margin:0 0 16px}
  .title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title h2{font-size:20px;margin:0}
  .tag{display:inline-block;padding:0 8px;border-radius:4px;font-size:12px;line-height:22px;color:#fff;white-space:nowrap}
  .tag.ai{background:#f9f0ff;color:#531dab;border:1px solid #d3adf7}
  .progedit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .progedit input[type=range]{width:220px;padding:0;border:0}
  .progedit output{min-width:44px;font-weight:600}
  button.p{background:var(--primary);border-color:var(--primary);color:#fff}
  button.p:hover{color:#fff;opacity:.85}
  .aistage{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .seg{display:flex;gap:2px;width:180px}
  .seg i{flex:1;height:6px;border-radius:3px;background:#f0f0f0}
  .seg i.on{background:var(--c)}
  .card h2 a.goai{margin-left:auto;font-size:13px;font-weight:400;color:var(--primary);text-decoration:none}
  .tag.mine{background:#e6f4ff;color:#0958d9;border:1px solid #91caff}
  .tag.other{background:#f5f5f5;color:#595959;border:1px solid #d9d9d9}
  a.btnlink{display:inline-block;padding:2px 12px;border:1px solid var(--primary);border-radius:6px;color:var(--primary);text-decoration:none;font-size:13px;font-weight:400}
  a.btnlink:hover{background:#e6f4ff}
  .tag.ok{background:var(--done)}.tag.wait{background:var(--warn)}.tag.st{background:#e6f4ff;color:#0958d9;border:1px solid #91caff}
  .tag.no{background:#fff2f0;color:#cf1322;border:1px solid #ffccc7}
  dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px;margin:16px 0 0}
  dl div{min-width:0}
  dt{font-size:13px;color:var(--sub);margin-bottom:4px}
  dd{margin:0;font-size:14px;word-break:break-word;white-space:pre-wrap}
  .pbar{display:flex;align-items:center;gap:10px}
  .pbar div{flex:1;height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden;max-width:240px}
  .pbar i{display:block;height:100%;background:var(--primary)}
  .grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px}
  .req{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:16px}
  .req div{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .req div.ok{background:#f6ffed;border-color:#b7eb8f}
  .req div.no{background:#fff2f0;border-color:#ffccc7}
  .drop{border:1px dashed #d9d9d9;border-radius:8px;padding:16px;text-align:center;color:var(--sub);font-size:14px;margin-bottom:16px;transition:background .15s}
  .drop.over{background:#e6f4ff;border-color:var(--primary)}
  .drop b{color:var(--primary);cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
  th{background:#fafafa;font-weight:600;white-space:nowrap}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.act{white-space:nowrap;text-align:right}
  .tablewrap{overflow-x:auto}
  button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer}
  button:hover{border-color:var(--primary);color:var(--primary)}
  button.del:hover{border-color:var(--danger);color:var(--danger)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .sub{color:var(--sub);font-size:12px}
  .empty{text-align:center;color:var(--sub);padding:24px}
  .notice{border-radius:8px;padding:10px 16px;font-size:14px}
  .notice.warn{background:#fffbe6;border:1px solid #ffe58f}
  .notice.err{background:#fff2f0;border:1px solid #ffccc7}
  .notice.ok{background:#f6ffed;border:1px solid #b7eb8f}
  .notice[hidden]{display:none}
  .timeline{list-style:none;margin:0;padding:0;max-height:520px;overflow:auto}
  .timeline li{position:relative;padding:0 0 16px 20px;font-size:14px}
  .timeline li::before{content:'';position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .timeline li::after{content:'';position:absolute;left:7px;top:16px;bottom:0;width:2px;background:var(--border)}
  .timeline li:last-child::after{display:none}
  .timeline time{display:block;font-size:12px;color:var(--sub)}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  @media(max-width:640px){aside{display:none}.content{padding:16px}}
</style>
</head>
<body>
<aside><h1><a href="index.html" title="처음 화면으로" style="display:inline;padding:0;color:inherit;background:none;text-decoration:none">TaskFlow</a></h1><a href="dashboard.html">대시보드</a><a class="child on" href="overall.html">└ 세부 진행 현황</a><a class="child" href="progress.html">└ 내 과제 진행률</a><a href="ai-projects.html">AI 과제 목록</a><a href="similar.html">유사과제 탐색</a></aside>
<div class="main">
  <header><a href="overall.html">← 세부 진행 현황</a>과제 상세<small id="mode"></small></header>
  <div class="content" id="app">
    <div class="notice warn" id="warn" hidden>지금은 <b>이 브라우저에만 임시 저장</b>됩니다. 올린 파일도 이 브라우저에서만 보입니다. 팀이 함께 보려면 <code>python3 server.py</code>로 실행한 주소(<code>http://localhost:8885</code>)에서 올려 주세요.</div>
    <div class="notice err" id="err" hidden></div>
    <div class="notice ok" id="okmsg" hidden></div>
    <div id="body"><div class="card empty">불러오는 중…</div></div>
  </div>
</div>
<input type="file" id="picker" multiple hidden>
<script src="demo-data.js"></script>
<script src="auth.js"></script>
<script src="storage.js"></script>
<script src="ai-storage.js"></script>
<script src="file-storage.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGE={todo:'검토',doing:'진행',done:'종료'};
const PRI={high:'높음',mid:'보통',low:'낮음'};
const taskId=new URLSearchParams(location.search).get('id');
const aiId=new URLSearchParams(location.search).get('ai');   // '내 AI 과제'에서 넘어오면 AI 과제 id
let task=null,ai=null,aiItems=[],files=[],busy=false;
const sameKey=s=>String(s||'').trim();
// AI 과제 목록의 단계 (뒤로 갈수록 진행이 많이 된 것)
const AI_STAGES=['기획중','개발중','승인요청','승인검토중','활용중','활용종료'];
const AI_COLOR={'기획중':'#8c8c8c','개발중':'#1677ff','승인요청':'#fa8c16','승인검토중':'#722ed1','활용중':'#52c41a','활용종료':'#bfbfbf'};

const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const when=s=>s?String(s).replace('T',' ').slice(0,16):'-';
function showError(m){$('err').textContent=m||'';$('err').hidden=!m}
let okTimer;function showOk(m){$('okmsg').textContent=m;$('okmsg').hidden=!m;clearTimeout(okTimer);if(m)okTimer=setTimeout(()=>$('okmsg').hidden=true,4000)}

function statusTag(t){
  if(t.registered)return '<span class="tag ok">서비스 게시 완료</span>';
  if((+t.progress||0)>=100)return '<span class="tag wait">서비스 게시 대기</span>';
  return `<span class="tag st">${STAGE[t.s]||esc(t.s)}</span>`;
}

// 누가 본 화면인가: 내 과제인지 / 다른 담당자의 과제인지 (로그인했을 때만 구분. 서버 없는 미리보기에서는 모두 수정 가능)
const myName=()=>(typeof Auth!=='undefined'&&Auth.user&&!Auth.preview&&Auth.user.name)||'';
const isMine=t=>!!myName()&&(t.assignee||'').trim()===myName();
// 수정 권한: 서버 없는 미리보기는 모두 가능, 과제참여자는 쓰기 불가(서버도 막음), 사이트관리자는 모두, 과제책임자는 내 과제만
const canEdit=t=>{
  if(!myName())return true;
  const role=Auth.user&&Auth.user.role;
  if(role==='member')return false;
  return role==='admin'||isMine(t);
};

// 어느 화면에서 왔는지(from)에 따라 돌아가기 링크와 사이드바 강조를 맞춘다
const FROM={dashboard:['dashboard.html','대시보드'],overall:['overall.html','세부 진행 현황'],progress:['progress.html','내 과제 진행률']};
const from=FROM[new URLSearchParams(location.search).get('from')]?new URLSearchParams(location.search).get('from'):'overall';
function applyFrom(){
  const [href,label]=FROM[from];
  const back=document.querySelector('header > a');
  if(back){back.href=href;back.textContent='← '+label}
  const navHrefs=Object.values(FROM).map(v=>v[0]);
  document.querySelectorAll('aside a').forEach(a=>{
    const h=a.getAttribute('href');
    if(navHrefs.includes(h))a.classList.toggle('on',h===href);
  });
}

function ownerTag(t){
  if(!myName())return '';
  if(isMine(t))return `<span class="tag mine">내 과제</span><a class="btnlink" href="progress.html?task=${encodeURIComponent(t.id)}">내 과제 진행률에서 보기 →</a>`;
  return `<span class="tag other">${esc(t.assignee||'담당자 없음')} 님의 과제${canEdit(t)?'':' · 조회 전용'}</span>`;
}

// AI 과제 정보 카드: AI 과제 목록에 등록된 내용 (목적·분류·단계·책임자·소속부서·접근권한)
function aiCard(a){
  const idx=Math.max(0,AI_STAGES.indexOf(a.stage)),col=AI_COLOR[a.stage]||'#8c8c8c';
  const day=s=>esc(String(s||'').slice(0,10))||'-';
  return `<div class="card">
    <h2>AI 과제 정보 <em>AI 과제 목록에 등록된 내용</em><a class="goai" href="ai-projects.html">AI 과제 목록 →</a></h2>
    <div class="aistage"><span class="tag" style="background:${col}">${esc(a.stage)}</span><span class="sub">${idx+1}/${AI_STAGES.length} 단계</span>
      <div class="seg" style="--c:${col}" title="${AI_STAGES.map((s,i)=>(i===idx?'● ':'')+s).join(' → ')}">${AI_STAGES.map((s,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div></div>
    <dl>
      <div style="grid-column:1/-1"><dt>목적</dt><dd>${esc(a.purpose)||'-'}</dd></div>
      <div><dt>분류</dt><dd>${esc(a.category)||'-'}</dd></div>
      <div><dt>과제책임자</dt><dd>${esc(a.ownerName)||'-'}</dd></div>
      <div><dt>소속부서</dt><dd>${esc(a.ownerDept)||'-'}</dd></div>
      <div><dt>접근권한</dt><dd>${esc(a.access)||'-'}</dd></div>
      <div><dt>등록일</dt><dd>${day(a.createdAt)}</dd></div>
      <div><dt>최종 수정</dt><dd>${day(a.updatedAt||a.createdAt)}</dd></div>
    </dl>
  </div>`;
}
// 연결된 진행률 과제가 없는 AI 과제: AI 과제 정보만 보여 준다
function renderAIOnly(){
  const a=ai,col=AI_COLOR[a.stage]||'#8c8c8c';
  const mineAI=!!myName()&&sameKey(a.ownerName)===myName();
  document.title=`TaskFlow · ${a.title}`;
  $('body').innerHTML=`
  <div style="display:grid;gap:16px">
    <div class="card">
      <div class="title"><h2>${esc(a.title)}</h2><span class="tag" style="background:${col}">${esc(a.stage)}</span><span class="tag ai">AI 과제</span>
        ${myName()?(mineAI?'<span class="tag mine">내 AI 과제</span>':`<span class="tag other">${esc(a.ownerName)} 님의 AI 과제</span>`):''}</div>
    </div>
    ${aiCard(a)}
    <div class="card empty" style="text-align:left">이 AI 과제와 연결된 <b>진행률 과제</b>가 없습니다(같은 명칭·같은 담당자 기준). 첨부 파일과 변경 이력은 진행률 과제에 쌓이므로 여기에는 표시되지 않습니다.
      <a class="tlink" href="progress.html">내 과제 진행률</a>에서 확인하세요.</div>
  </div>`;
}

function render(){
  if(!task){renderAIOnly();return}
  const t=task,p=Math.min(100,Math.max(0,+t.progress||0)),edit=canEdit(t);
  // 진행률 변경은 이 상세 페이지에서만 한다: '진행' 단계이고 아직 100%가 아니며 서비스 게시 전인 과제를 수정 권한이 있는 사람이
  const progEditable=edit&&t.s==='doing'&&!t.registered&&p<100;
  const req=FileStorage.checkRequired(files),okCnt=req.filter(r=>r.ok).length;
  const sorted=[...files].sort((a,b)=>String(b.uploadedAt).localeCompare(String(a.uploadedAt)));
  const hist=[...(t.history||[])].reverse();
  document.title=`TaskFlow · ${t.title}`;
  $('body').innerHTML=`
  <div style="display:grid;gap:16px">
    <div class="card">
      <div class="title"><h2>${esc(t.title)}</h2>${statusTag(t)}${ownerTag(t)}</div>
      <dl>
        <div><dt>담당자</dt><dd>${esc(t.assignee)||'-'}</dd></div>
        <div><dt>단계</dt><dd>${STAGE[t.s]||esc(t.s)||'-'}</dd></div>
        <div><dt>진행률</dt><dd><div class="pbar"><div><i style="width:${p}%"></i></div><b>${p}%</b></div></dd></div>
        <div><dt>우선순위</dt><dd>${PRI[t.priority]||'-'}</dd></div>
        <div><dt>등록일</dt><dd>${esc(t.date)||'-'}</dd></div>
        <div><dt>마감일</dt><dd>${esc(t.due)||'-'}</dd></div>
        <div><dt>서비스 게시일</dt><dd>${esc(t.registeredAt)||'-'}</dd></div>
        <div><dt>승인자</dt><dd>${esc(t.approver)||'-'}</dd></div>
        <div style="grid-column:1/-1"><dt>게시 사유</dt><dd>${esc(t.regReason)||'-'}</dd></div>
        ${t.memo?`<div style="grid-column:1/-1"><dt>메모</dt><dd>${esc(t.memo)}</dd></div>`:''}
      </dl>
      ${progEditable?`<div class="progedit">
        <b>진행률 변경</b>
        <input type="range" min="0" max="100" step="5" value="${p}" id="pgRange" aria-label="진행률"><output id="pgOut">${p}%</output>
        <button type="button" class="p" id="pgSave">저장</button><button type="button" id="pgFull">100% 완료</button>
        <span class="sub">저장하면 변경 이력에 기록됩니다. 100%가 되면 '서비스 게시 대기'로 옮겨집니다.</span>
      </div>`:(edit?`<div class="progedit"><span class="sub">진행률은 '진행' 단계이고 100% 미만인 과제만 여기서 바꿀 수 있습니다.</span></div>`:'')}
    </div>
    <div class="grid2">
      <div class="card">
        <h2>첨부 파일 <em>${files.length}개</em></h2>
        <p class="desc">필수 첨부 3종은 파일 확장자로만 확인합니다(내용은 보지 않음).${edit?' 파일 1개당 20MB까지 올릴 수 있습니다.':' 다른 담당자의 과제라 내려받기만 할 수 있습니다.'}</p>
        <div class="req">${req.map(r=>`<div class="${r.ok?'ok':'no'}"><span>${esc(r.label)}</span>${r.ok?'<span class="tag ok">있음</span>':'<span class="tag no">없음</span>'}</div>`).join('')}</div>
        <div class="sub" style="margin:-8px 0 16px">필수 첨부 ${okCnt}/3${okCnt===3?' — 모두 갖춰졌습니다.':' — 빠진 파일이 있습니다.'}</div>
        ${edit?'<div class="drop" id="drop">파일을 여기로 끌어다 놓거나 <b id="pick">파일 선택</b></div>':''}
        ${sorted.length?`<div class="tablewrap"><table>
          <thead><tr><th>파일</th><th>종류</th><th style="text-align:right">크기</th><th>올린 시각</th><th></th></tr></thead>
          <tbody>${sorted.map(f=>`<tr><td>${esc(f.name)}</td><td>${f.kind==='기타'?'<span class="sub">기타</span>':esc(f.kind)}</td><td class="num">${size(f.size)}</td><td class="sub">${when(f.uploadedAt)}</td>
            <td class="act"><button data-dl="${esc(f.id)}">내려받기</button>${edit?` <button class="del" data-rm="${esc(f.id)}">삭제</button>`:''}</td></tr>`).join('')}</tbody></table></div>`
          :'<div class="empty">올라간 파일이 없습니다.</div>'}
      </div>
      <div class="card">
        <h2>변경 이력 <em>${hist.length}건</em></h2>
        <p class="desc">최근 순</p>
        ${hist.length?`<ul class="timeline">${hist.map(h=>`<li><time>${when(h.at&&new Date(h.at).toLocaleString('sv-SE'))}</time>${esc(h.text)}</li>`).join('')}</ul>`:'<div class="empty">기록된 이력이 없습니다.</div>'}
      </div>
    </div>
  </div>`;
  const drop=$('drop');
  if(drop){
    $('pick').onclick=()=>$('picker').click();
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
    drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');upload([...e.dataTransfer.files])};
  }
}

// 과제(진행률)와 AI 과제는 '같은 명칭 + 같은 담당자(책임자) 이름'으로 연결된다
async function reload(){
  const tasks=await TaskStorage.list();
  try{aiItems=await AIStorage.list()}catch(e){aiItems=[]}
  if(aiId){          // AI 과제에서 들어옴: 연결된 진행률 과제가 있으면 그것을 상세로 보여 준다
    ai=aiItems.find(p=>String(p.id)===String(aiId))||null;
    task=ai?tasks.find(t=>sameKey(t.title)===sameKey(ai.title)&&sameKey(t.assignee)===sameKey(ai.ownerName))||null:null;
  }else{             // 진행률 과제에서 들어옴: 연결된 AI 과제가 있으면 정보를 함께 보여 준다
    task=tasks.find(t=>String(t.id)===String(taskId))||null;
    ai=task?aiItems.find(p=>sameKey(p.title)===sameKey(task.title)&&sameKey(p.ownerName)===sameKey(task.assignee))||null:null;
  }
  files=task?await FileStorage.list(task.id):[];
}

async function upload(list){
  if(!list.length||busy||!canEdit(task))return;
  busy=true;showError('');
  const done=[],failed=[];
  for(const f of list){try{await FileStorage.upload(task.id,f);done.push(f.name)}catch(e){failed.push(e.message)}}
  try{await reload()}catch(e){}
  busy=false;render();
  if(failed.length)showError('올리지 못한 파일: '+failed.join(' / '));
  if(done.length)showOk(`${done.length}개 파일을 올렸습니다.`);
}

// 진행률 저장 (슬라이더 값 또는 100% 완료). 서버도 역할에 따라 쓰기를 한 번 더 검사한다.
async function saveProgress(v){
  if(!task||!canEdit(task)||busy)return;
  busy=true;showError('');
  try{
    await TaskStorage.update(task.id,{progress:v});
    await reload();
    busy=false;render();
    showOk(v===100?'100%를 달성했습니다. 서비스 게시 대기로 이동했습니다.':'진행률을 저장했습니다.');
  }catch(err){busy=false;showError('저장하지 못했습니다: '+err.message)}
}
document.addEventListener('input',e=>{
  if(e.target.id==='pgRange')$('pgOut').textContent=e.target.value+'%';
});
$('picker').onchange=e=>{upload([...e.target.files]);e.target.value=''};
document.addEventListener('click',async e=>{
  const d=e.target.dataset;
  const meta=id=>files.find(f=>f.id===id);
  if(e.target.id==='pgSave')saveProgress(+$('pgRange').value);
  if(e.target.id==='pgFull')saveProgress(100);
  if(d.dl){try{await FileStorage.download(task.id,meta(d.dl))}catch(err){showError(err.message)}}
  if(d.rm){
    const f=meta(d.rm);if(!f||!canEdit(task)||!confirm(`'${f.name}' 파일을 삭제할까요? 되돌릴 수 없습니다.`))return;
    try{await FileStorage.remove(task.id,f);await reload();render();showOk('파일을 삭제했습니다.')}catch(err){showError('삭제하지 못했습니다: '+err.message)}
  }
});

(async()=>{
  try{await TaskStorage.init()}catch(e){}
  try{await AIStorage.init()}catch(e){}
  const server=TaskStorage.mode==='server';
  $('mode').textContent=server?'● 서버 파일에 저장 중':'● 브라우저 임시 저장';
  $('warn').hidden=server;
  try{await reload()}catch(e){showError('불러오지 못했습니다: '+e.message)}
  applyFrom();
  if(!task&&!ai){$('body').innerHTML=`<div class="card empty">과제를 찾을 수 없습니다. <a href="${FROM[from][0]}">${FROM[from][1]}(으)로 돌아가기</a></div>`;return}
  render();
})();
</script>
</body>
</html>
